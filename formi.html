<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, intial-scale=1.0">
    <title>Form with Table</title>
    </head>
    <body>
        <form>
            <h2><b><i><u>Student Detalis</u></i></b></h2>
            <table border="1" cellpadding="8" cellspacing="0">
                <tr>
            <td>Username:</td>
            <td><input type="text" name="username"></td>
            </tr>

            <tr>
            <td>Email:</td>
            <td><input type="email" name="Email"></td>
            </tr>

            <tr>
            <td>Confirm Email:</td>
            <td><input type="email" name="Confirm Email"></td>
            </tr>

            <td>Password:</td>
            <td><input type="password" name="Password"></td>
            </tr>

            <tr>
            <td>Gender</td>
            <td>
            <input type="radio" name="Gender" value="male">Male
            <input type="radio" name="Gender" value="female">Female
            </td>
            </tr>

            <tr>
            <td>Select Skills:</td>
            <td>
            <input type="checkbox" name="Select Skills" value="Web Technologies">Web Technologies<br>
            <input type="checkbox" name="Select Skills" value="Java">Java<br>
            <input type="checkbox" name="Select Skills" value="Python">Python<br>
            <input type="checkbox" name="Select Skills" value="C++/C#">C++/C#<br>
            </td>
            </tr>

            <tr>
            <td>Choose file:</td>
            <td><input type="file"  name="file"></td>
            </tr>

            <tr>
            <td>Message:</td>
            <td><textarea name="message" rows="5" cols="30"></textarea></td>
            </tr>

            <tr>
            <td colspan="2" style="text-align: right;">
            <input type="Submit" value="Submit">
            </td>
            </tr>
            </table>
            <a href="findex.html">Go Back</a>
            </form>
            
        </body>
        </html>
