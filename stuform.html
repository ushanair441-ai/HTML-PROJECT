           <legend><h2><b>Student Regestration Form</b></h2></legend>
        <table border=1 cellpadding="5" cellspacing="0">

                <td>Roll no:</td>
                <td>
               <input type="number" placeholder="Registration number" autofocus/>
                </td>

            <tr>
                <td>Student name:</td>
                <td>
                    <input type="text"  placeholder="First Name" autofocus/>

                    <input type="text"  placeholder="last Name"  autofocus/>

            <tr>

            <tr>

            </td>
            </tr>
            <tr>

                    <input type="email" placeholder="EmailID" autofocus/>

                    <input type="password" autofocus/>

                    <input type="radio" name="Gender" value="male">Male
